name: Trivy Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.trivyignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/trivy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.trivyignore'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # wöchentlich, Dienstag 04:23 UTC (nach Dependabot Montag)
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerfile-scan:
    name: Trivy Dockerfile (misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # version pinned (vs. implicit latest) — zizmor unpinned-tools.
          # Bump in lockstep with the action SHA above when Dependabot opens a PR.
          version: v0.72.0
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload config SARIF to Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  image-scan:
    name: Trivy Image (CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Compute daily APT_REFRESH key
        id: refresh
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: wissen:trivy
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APT_REFRESH=${{ steps.refresh.outputs.value }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # version pinned (vs. implicit latest) — zizmor unpinned-tools.
          version: v0.72.0
          image-ref: 'wissen:trivy'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload image SARIF to Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

      - name: Summary for PR
        if: always()
        run: |
          echo "### Trivy Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Siehe Security-Tab für detaillierte Findings." >> $GITHUB_STEP_SUMMARY
