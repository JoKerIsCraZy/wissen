name: Trivy Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.trivyignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/trivy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.trivyignore'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # wöchentlich, Dienstag 04:23 UTC (nach Dependabot Montag)
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerfile-scan:
    name: Trivy Dockerfile (misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # version pinned (vs. implicit latest) — zizmor unpinned-tools.
          # Bump in lockstep with the action SHA above when Dependabot opens a PR.
          version: v0.71.1
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload config SARIF to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  image-scan:
    name: Trivy Image (CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Compute daily APT_REFRESH key
        id: refresh
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: wissen:trivy
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APT_REFRESH=${{ steps.refresh.outputs.value }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # version pinned (vs. implicit latest) — zizmor unpinned-tools.
          version: v0.71.1
          image-ref: 'wissen:trivy'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload image SARIF to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

      - name: Summary for PR
        if: always()
        run: |
          echo "### Trivy Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Siehe Security-Tab für detaillierte Findings." >> $GITHUB_STEP_SUMMARY
