name: OSV-Scanner

# Googles OSV-Datenbank (Open Source Vulnerabilities) — ergänzt
# Trivy und Dependabot, deckt oft Lücken in der GHSA-DB ab.
# Scannt package-lock.json (root) + web-svelte/package-lock.json + site/.
#
# site/ ist die Astro-Doku (statisches HTML auf GitHub Pages) — die Deps laufen
# also NIE im Browser eines Besuchers oder auf einem Server. Trotzdem gescannt,
# weil `npm ci` + `astro build` fremden Code im CI ausführen: ein kompromittiertes
# Build-Paket könnte das Artefakt site/dist vergiften, das anschliessend nach
# Pages deployed wird. Runtime-CVEs dort sind irrelevant, Supply-Chain nicht.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'web-svelte/package.json'
      - 'web-svelte/package-lock.json'
      - 'site/package.json'
      - 'site/package-lock.json'
      - '.github/workflows/osv-scanner.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'web-svelte/package.json'
      - 'web-svelte/package-lock.json'
      - 'site/package.json'
      - 'site/package-lock.json'
  schedule:
    # wöchentlich, Donnerstag 04:37 UTC
    - cron: '37 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      # Scan-Paths: root + Svelte-Frontend + Astro-Doku
      scan-args: |-
        --lockfile=./package-lock.json
        --lockfile=./web-svelte/package-lock.json
        --lockfile=./site/package-lock.json
      # SARIF upload aktivieren
      upload-sarif: true
    permissions:
      contents: read
      security-events: write
      actions: read
