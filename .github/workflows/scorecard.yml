name: OpenSSF Scorecard

# Wöchentliche Bewertung der Repo-Security-Posture:
# Branch-Protection, Action-Pinning, Token-Permissions, SAST,
# Dangerous Workflows, Code-Review-Praxis, Maintained-Status.
#
# Ergebnis landet im Security-Tab (SARIF) + auf scorecard.dev wenn
# publish_results=true gesetzt ist (nur für public repos).

on:
  branch_protection_rule:
  schedule:
    # wöchentlich, Freitag 03:42 UTC
    - cron: '42 3 * * 5'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Für Publish auf scorecard.dev
      id-token: write
      # Für SARIF-Upload zum Security-Tab
      security-events: write
      # Lese-Zugriff auf Actions/Contents für die Checks
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results=true ist nur für public repos sinnvoll
          # (Eintrag auf https://scorecard.dev). Auf false setzen
          # falls Repo private wird.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
