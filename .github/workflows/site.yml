name: Site — build & deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # Desktop-Dashboard-Demo wird aus web-svelte/ in die Site gebaut —
      # Änderungen dort müssen die Pages-Deployment ebenfalls auslösen.
      - 'web-svelte/**'
      - '.github/workflows/site.yml'
  # Re-deploy when a release is published so the hero pill (and any other
  # version-derived content) picks up the new tag without a manual site edit.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro Starlight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch tags so AnimatedHero's git-describe fallback resolves the
          # latest version when no explicit release tag is in the trigger.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            site/package-lock.json
            web-svelte/package-lock.json

      # Desktop-Dashboard-Demo: das echte SvelteKit-Dashboard statisch bauen
      # (BASE_PATH=/wissen/desktop-demo) + Mock-API-Layer injizieren. Output
      # landet in site/public/desktop-demo/ → Astro kopiert es in dist/.
      # MUSS vor "Build site" laufen (Astro liest public/ zur Build-Zeit).
      - name: Build desktop-dashboard demo
        working-directory: web-svelte
        run: |
          npm ci
          npm run build:demo

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production
          # On `release: published` the tag is authoritative; for push/manual
          # runs leave it empty so the component falls back to the latest git
          # tag (then to package.json).
          SITE_VERSION: ${{ github.event.release.tag_name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
