# Dependabot auto-update config
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm packages in package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # SvelteKit V2 frontend has its own package.json + lockfile.
  # Security updates for vite, sveltekit, svelte etc. flow here.
  - package-ecosystem: "npm"
    directory: "/web-svelte"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # @sveltejs/kit erlaubt nur typescript ^5.3.3 || ^6.0.0 (peerOptional);
      # TS-7-Major-Bumps brechen `npm ci` (ERESOLVE) — erst freigeben, wenn Kit TS 7 unterstützt.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Dockerfile base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    groups:
      # init/autobuild/analyze/upload-sarif muessen dieselbe Version haben,
      # sonst bricht CodeQL mit einem Config-Versions-Mismatch ab.
      codeql-action:
        patterns:
          - "github/codeql-action*"
